<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style=" background-color: #212121; color: aliceblue;">   
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
   <script>
    // This  method will try to traverse the whole tree from top to bottom this case is small but in the some case where the the values are in lakh then this is not the optimized approch
    function addlanguage(langname){
     const li = document.createElement('li');
     li.innerHTML = `${langname}`
     document.querySelector('.language').appendChild(li)
    }

    addlanguage("Python")
    addlanguage("Rust")

    // Now we try optimied approch as we learn in the 04 document
    
    function addoptilangname(langname){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langname)) // This is first step
        document.querySelector('.language').appendChild(li)
    }
    addoptilangname('golang')
    addoptilangname('C++')

    // Edit = My making a new element and then replacing the new element with other element
    const secondlang = document.querySelector("li:nth-child(2)")
    // secondlang.innerHTML = "Mojo"  ----> By making innerHTML
    const newli = document.createElement('li')
    newli.textContent = "mojo"
    secondlang.replaceWith(newli)

   // Example 2
    const editlang = document.querySelector("li:nth-child(3)")
    const newli2 = document.createElement('li')
    newli2.textContent = "Ninja"
    editlang.replaceWith(newli2)
   //  Edit by making a outer html
   const firstlang = document.querySelector("li:first-child")
   firstlang.outerHTML = "<li>Typescript</>"

    // remove = ----> Esiest
    const removelang = document.querySelector("li:last-child")
    removelang.remove()
   </script>
</html>
