<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to create a element and then display the element on the live page </title>
</head>

<body style="background-color: #212121; color: white">

</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("title", "Genrated title")
    div.style.backgroundColor = 'green'
    div.style.padding = "15px"
    // div.innerText = "Chai or  code = this method over writte the value and then take the 2 round trip "
    // document.body.append(div)

    const addtext = document.createTextNode("Chai or code = IN this method it does not over write the value = this will take only one round trip")
    div.appendChild(addtext)
    document.body.appendChild(div)
</script>

</html>
