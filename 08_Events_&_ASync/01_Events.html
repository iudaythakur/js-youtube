<script>

    //  document.getElementById('owl').onclick= function(){
    //     alert("Owl clicked")
    //  }

    // attachEvent = used in early time is internet explorer
    // jQuery-on
    // type, timestamp , defaultprevented
    //target, toElement, scrElement , currentTarget,
    // clientX, clienty , screenX , ScreenY
    // altKey , ctrlkey , shiftkey, keyCode


    //Event = Event listner

    // document.getElementById('owl').addEventListener('click', function () {
    //     alert('owl clicked')
    // })


    // Event object ******** 
    document.getElementById('images').addEventListener('click', function (e) {
        console.log("Clicked inside the ul");
    }, false)   // event propogation ----> Two cases / false = event bubbling (default case)    Child ---> Parent
    // true = event capturing   means Parent --> Child

    document.getElementById('owl').addEventListener('click', function (e) {
        console.log("Owl clicked");
        e.stopPropagation() // Don't go to the parent
    }, false) // Bubbling = Top ---> Bottom

    document.getElementById('images').addEventListener('click', function (e) {
        console.log("Clicked inside the ul");
    }, true)

    document.getElementById('owl').addEventListener('click', function (e) {
        console.log(" owl Clicked ");
        e.preventDefault()  // To prevent bubbling
        e.stopPropagation()
    }, true)  // Capturing = Bottom --> Top
