<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
</head>

<body>
    <h1>Chair of code</h1>
    <button id="stop">stop</button>
</body>
<script>
    // setTimeout(() => {
    //     console.log("Uday thakur");

    // }, 2000);

    const sayuday = () => {
        console.log("Uday thakur");

    }
    setTimeout(sayuday, 2000);

    const changeText = function () {
        document.querySelector('h1').innerHTML = 'Best Java Script Series'
    }

    // setTimeout(changeText, 2000);

    const stopthistimeout = setTimeout(changeText, 2000);
    document.querySelector('#stop').addEventListener('click', function ()
     { 
        clearTimeout(stopthistimeout) 
        console.log("STOPPED");
        
     })

</script>

</html>
